name: VirusTotal Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to scan"
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to scan"
        required: true
        type: string

permissions:
  contents: write

jobs:
  virustotal_scan:
    runs-on: ubuntu-latest
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
      # Stable marker so re-runs replace only the VT section, not the whole release body.
      VT_REPORT_MARKER: "<!-- virustotal-report -->"

    steps:
      - name: Set tag variable
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "Error: Release tag could not be determined."
            exit 1
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          gh release download "$TAG_NAME" --dir release_assets --pattern "*.apk"
          ls -la release_assets

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            release_assets/*.apk
          request_rate: 4

      - name: Generate Custom Badge Report
        if: steps.vt.outcome == 'success'
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          {
            echo "$VT_REPORT_MARKER"
            echo "## VirusTotal Analysis"
            echo ""
            echo "| Build Variant | VirusTotal Status | Detailed Report |"
            echo "| :--- | :--- | :--- |"
          } > vt_report.txt

          for file in release_assets/*.apk; do
            [ -e "$file" ] || continue
            filename=$(basename "$file")
            sha256=$(sha256sum "$file" | awk '{print $1}')

            vt_link="https://www.virustotal.com/gui/file/$sha256/detection"
            badge_url="https://badges.cssnr.com/vt/id/$sha256?start=green&end=red&n=8"

            echo "Purging badge cache for $filename..."
            curl -s -X POST "$badge_url" || true

            asset_link="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/$filename"

            echo "| [$filename]($asset_link) | [![](${badge_url}&v=$(date +%s))]($vt_link) | [View Report]($vt_link) |" >> vt_report.txt
          done

      - name: Update Release Notes
        if: steps.vt.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Preserve existing release notes; only replace a previous VT section if present.
          gh release view "$TAG_NAME" --json body -q .body > current_notes.txt || true
          if [ ! -s current_notes.txt ] || [ "$(cat current_notes.txt)" = "null" ]; then
            : > current_notes.txt
          fi

          if grep -Fq "$VT_REPORT_MARKER" current_notes.txt; then
            echo "Previous VirusTotal report found; removing old section..."
            # Delete from the marker line through end of file (old VT block).
            awk -v marker="$VT_REPORT_MARKER" '
              $0 == marker { exit }
              { print }
            ' current_notes.txt > notes_without_vt.txt
            mv notes_without_vt.txt current_notes.txt
          fi

          # Append VT report after existing notes (keep original release body intact).
          {
            if [ -s current_notes.txt ]; then
              # Strip trailing blank lines from preserved notes.
              awk 'NF { last = NR } { lines[NR] = $0 } END { for (i = 1; i <= last; i++) print lines[i] }' current_notes.txt
              printf '\n\n'
            fi
            cat vt_report.txt
            printf '\n'
          } > final_notes.txt

          gh release edit "$TAG_NAME" --notes-file final_notes.txt
